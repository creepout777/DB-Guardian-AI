# Supabase Project Configuration File
# Version-controlled auth settings, email verification, and OAuth provider definitions

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173", "https://*.vercel.app"]
jwt_expiry = 3600

# Email Authentication & Verification Config
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true # Requires email verification before first login!

# OAuth2 Providers Setup
[auth.external.github]
enabled = true
client_id = "env(VITE_GITHUB_CLIENT_ID)"

[auth.external.google]
enabled = true
client_id = "env(VITE_GOOGLE_CLIENT_ID)"
