name: Supabase Automated Database Migration

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Migrations to Supabase Database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --password "$SUPABASE_DB_PASSWORD"
          else
            supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          fi
