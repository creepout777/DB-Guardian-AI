name: Supabase Automated Database Migration

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase migration repair --status reverted 20260830040000 20260830041500 20260830042800 20260830045200 --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} || true
          if [ -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --password "${{ secrets.SUPABASE_DB_PASSWORD }}" --include-all
          else
            supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --include-all
          fi
