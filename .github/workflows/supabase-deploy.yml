name: Supabase Automated Database Migration

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
            supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
          else
            supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --no-interactive
          fi
